# Alembic config for tinybeat-pregnancy.
#
# The env.py is a 3-liner that hands APP_CONFIG to byoh_bridge.alembic_support;
# the DB URL is derived at runtime from the active AppConfig (BYOH_DATA_DIR /
# <hermes_home>/tinybeat-pregnancy/app.db), so it is intentionally not set here.

[alembic]
script_location = src/tinybeat_pregnancy/alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
